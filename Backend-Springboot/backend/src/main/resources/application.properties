# ============================================================
# Smart Learning Hub - Application Configuration
# ============================================================

spring.application.name=smart-learning-hub-backend
server.port=8080

# ---------------- Database ----------------
spring.datasource.url=jdbc:mysql://localhost:3306/smart_learning_hub?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---------------- JPA / Hibernate ----------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# ---------------- JWT ----------------
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=86400000
app.jwt.refresh-expiration-ms=604800000

# ---------------- CORS ----------------
app.cors.allowed-origins=http://localhost:3000

# ---------------- Mail ----------------
app.frontend.reset-password-url=http://localhost:3000/reset-password

# ---------------- AI Configuration ----------------
app.ai.provider=gemini
app.ai.gemini.api-key=${GEMINI_API_KEY}
app.ai.openai.api-key=

# ---------------- External Services ----------------
app.certificate-service.base-url=http://localhost:5000/api

# ---------------- Logging ----------------
logging.level.root=INFO
logging.level.com.smartlearninghub=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %-5level - %logger{36} - %msg%n

# ---------------- Swagger ----------------
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# ---------------- Payment ----------------
stripe.secret.key=${STRIPE_SECRET_KEY}
stripe.publishable.key=${STRIPE_PUBLISHABLE_KEY}
frontend.url=http://localhost:3000

# ---------------- File Upload ----------------
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
app.upload.dir=uploads